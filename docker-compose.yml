services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    cpus: '4.0'
    mem_limit: 2048M

  app:
    cpus: '1.0'
    mem_limit: 1024M
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - QDRANT_HOST=${QDRANT_HOST}
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/adc.json
      - VERTEX_PROJECT=${VERTEX_PROJECT}
      - VERTEX_LOCATION=${VERTEX_LOCATION}
      # OrbStack injects no_proxy/NO_PROXY with IPv6 CIDRs (e.g. fd07:b51a:cc66:f0::/64)
      # that crash httpx's URLPattern parser and gRPC's proxy handling.
      # Override with a clean list: qdrant (same bridge network, no proxy needed) +
      # localhost entries.  External traffic (Vertex AI) still routes via HTTP_PROXY.
      - no_proxy=localhost,127.0.0.1,qdrant
      - NO_PROXY=localhost,127.0.0.1,qdrant
      - INGEST_SHARED_SECRET=${INGEST_SHARED_SECRET}
    volumes:
      - $HOME/.config/gcloud/application_default_credentials.json:/tmp/adc.json:ro
    depends_on:
      - qdrant
    ports:
      - "8080:8080"

volumes:
  qdrant_data: